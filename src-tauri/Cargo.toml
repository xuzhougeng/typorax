[package]
name = "typorax"
version = "0.1.1"
description = "Typorax desktop shell"
authors = ["xzg"]
edition = "2021"

[lib]
name = "typorax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0", features = [] }
thiserror = "2.0.12"
